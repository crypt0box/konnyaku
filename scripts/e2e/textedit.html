<h1>Caring for the ZX-81 Espresso Machine</h1>
<p>Clean the steam wand after <b>every</b> use, and descale the boiler once a month.</p>
<ul>
  <li>Empty the drip tray every morning</li>
  <li>Replace the water filter every two months</li>
</ul>
<table border="1">
  <tr><th>Part</th><th>Interval</th></tr>
  <tr><td>Gasket</td><td>Every year</td></tr>
  <tr><td>Shower screen</td><td>Every six months</td></tr>
</table>
