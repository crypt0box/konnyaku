[package]
name = "konnyaku"
version = "0.1.0"
description = "Select foreign-language content anywhere and read it in Japanese"
edition = "2024"

[lib]
# A distinct lib name avoids a bin/lib name clash on Windows (rust-lang/cargo#8519).
name = "konnyaku_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-store = "2.5.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-single-instance = "2.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-foundation = "0.3.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
